name: cybersec-career-intelligence

services:
  backend:
    build:
      context: ./backend
    ports:
      - "127.0.0.1:8100:8000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: cybersec
      DB_USER: cybersec
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:latest}
      OPENWEBUI_BASE_URL: ${OPENWEBUI_BASE_URL:-}
      OPENWEBUI_API_KEY: ${OPENWEBUI_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      AI_MODEL: ${AI_MODEL:-}
      OPENWEBUI_TIMEOUT_SECONDS: ${OPENWEBUI_TIMEOUT_SECONDS:-90}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-90}
      OLLAMA_RETRIES: ${OLLAMA_RETRIES:-2}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      MAX_RESEARCH_BYTES: ${MAX_RESEARCH_BYTES:-500000}
      URL_IMPORT_TIMEOUT_SECONDS: ${URL_IMPORT_TIMEOUT_SECONDS:-10}
      URL_IMPORT_MAX_BYTES: ${URL_IMPORT_MAX_BYTES:-1000000}
      URL_IMPORT_MAX_REDIRECTS: ${URL_IMPORT_MAX_REDIRECTS:-5}
      RESEARCH_REQUEST_TIMEOUT_SECONDS: ${RESEARCH_REQUEST_TIMEOUT_SECONDS:-15}
      RESEARCH_RESPONSE_MAX_BYTES: ${RESEARCH_RESPONSE_MAX_BYTES:-1000000}
      RESEARCH_RETRY_COUNT: ${RESEARCH_RETRY_COUNT:-2}
      RESEARCH_RETRY_BASE_SECONDS: ${RESEARCH_RETRY_BASE_SECONDS:-1}
      RESEARCH_MAX_ITEMS_PER_RUN: ${RESEARCH_MAX_ITEMS_PER_RUN:-50}
      RESEARCH_SCHEDULER_ENABLED: ${RESEARCH_SCHEDULER_ENABLED:-true}
      RESEARCH_SCHEDULER_POLL_SECONDS: ${RESEARCH_SCHEDULER_POLL_SECONDS:-30}
      RESEARCH_LOCK_TTL_SECONDS: ${RESEARCH_LOCK_TTL_SECONDS:-900}
      RESEARCH_ALLOWED_USER_AGENT: ${RESEARCH_ALLOWED_USER_AGENT:-CyberSecCareerIntelligenceResearch/1.0}
      RESEARCH_DEFAULT_RESPECT_ROBOTS: ${RESEARCH_DEFAULT_RESPECT_ROBOTS:-true}
      LINKEDIN_AUTHORIZED_API_BASE_URL: ${LINKEDIN_AUTHORIZED_API_BASE_URL:-}
      LINKEDIN_AUTHORIZED_API_KEY: ${LINKEDIN_AUTHORIZED_API_KEY:-}
      LICENSED_JOB_PROVIDER_BASE_URL: ${LICENSED_JOB_PROVIDER_BASE_URL:-}
      LICENSED_JOB_PROVIDER_API_KEY: ${LICENSED_JOB_PROVIDER_API_KEY:-}
      EMPLOYER_ATS_API_BASE_URL: ${EMPLOYER_ATS_API_BASE_URL:-}
      EMPLOYER_ATS_API_KEY: ${EMPLOYER_ATS_API_KEY:-}
      JSEARCH_API_KEY: ${JSEARCH_API_KEY:-}
      JSEARCH_API_HOST: ${JSEARCH_API_HOST:-jsearch.p.rapidapi.com}
      JSEARCH_API_ENDPOINT: ${JSEARCH_API_ENDPOINT:-https://jsearch.p.rapidapi.com/search-v2}
      JSEARCH_JOB_DETAILS_ENDPOINT: ${JSEARCH_JOB_DETAILS_ENDPOINT:-https://jsearch.p.rapidapi.com/job-details}
      JSEARCH_TIMEOUT_SECONDS: ${JSEARCH_TIMEOUT_SECONDS:-15}
      JSEARCH_MAX_REQUESTS_PER_RUN: ${JSEARCH_MAX_REQUESTS_PER_RUN:-10}
      JSEARCH_MAX_RESULTS_PER_RUN: ${JSEARCH_MAX_RESULTS_PER_RUN:-100}
      JSEARCH_MAX_PAGES_PER_RUN: ${JSEARCH_MAX_PAGES_PER_RUN:-3}
      JSEARCH_RETRY_COUNT: ${JSEARCH_RETRY_COUNT:-2}
      JSEARCH_RETRY_BASE_SECONDS: ${JSEARCH_RETRY_BASE_SECONDS:-1}
      JSEARCH_RATE_LIMIT_SLEEP_SECONDS: ${JSEARCH_RATE_LIMIT_SLEEP_SECONDS:-2}
      JOB_SEARCH_RETENTION_DAYS: ${JOB_SEARCH_RETENTION_DAYS:-90}
      CORS_ORIGINS: http://localhost:3100,http://127.0.0.1:3100
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
    networks:
      - cybersec-network

  research-scheduler:
    build:
      context: ./backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: cybersec
      DB_USER: cybersec
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:latest}
      OPENWEBUI_BASE_URL: ${OPENWEBUI_BASE_URL:-}
      OPENWEBUI_API_KEY: ${OPENWEBUI_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      AI_MODEL: ${AI_MODEL:-}
      OPENWEBUI_TIMEOUT_SECONDS: ${OPENWEBUI_TIMEOUT_SECONDS:-90}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-90}
      OLLAMA_RETRIES: ${OLLAMA_RETRIES:-2}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      MAX_RESEARCH_BYTES: ${MAX_RESEARCH_BYTES:-500000}
      URL_IMPORT_TIMEOUT_SECONDS: ${URL_IMPORT_TIMEOUT_SECONDS:-10}
      URL_IMPORT_MAX_BYTES: ${URL_IMPORT_MAX_BYTES:-1000000}
      URL_IMPORT_MAX_REDIRECTS: ${URL_IMPORT_MAX_REDIRECTS:-5}
      RESEARCH_REQUEST_TIMEOUT_SECONDS: ${RESEARCH_REQUEST_TIMEOUT_SECONDS:-15}
      RESEARCH_RESPONSE_MAX_BYTES: ${RESEARCH_RESPONSE_MAX_BYTES:-1000000}
      RESEARCH_RETRY_COUNT: ${RESEARCH_RETRY_COUNT:-2}
      RESEARCH_RETRY_BASE_SECONDS: ${RESEARCH_RETRY_BASE_SECONDS:-1}
      RESEARCH_MAX_ITEMS_PER_RUN: ${RESEARCH_MAX_ITEMS_PER_RUN:-50}
      RESEARCH_SCHEDULER_ENABLED: ${RESEARCH_SCHEDULER_ENABLED:-true}
      RESEARCH_SCHEDULER_POLL_SECONDS: ${RESEARCH_SCHEDULER_POLL_SECONDS:-30}
      RESEARCH_LOCK_TTL_SECONDS: ${RESEARCH_LOCK_TTL_SECONDS:-900}
      RESEARCH_ALLOWED_USER_AGENT: ${RESEARCH_ALLOWED_USER_AGENT:-CyberSecCareerIntelligenceResearch/1.0}
      RESEARCH_DEFAULT_RESPECT_ROBOTS: ${RESEARCH_DEFAULT_RESPECT_ROBOTS:-true}
      LINKEDIN_AUTHORIZED_API_BASE_URL: ${LINKEDIN_AUTHORIZED_API_BASE_URL:-}
      LINKEDIN_AUTHORIZED_API_KEY: ${LINKEDIN_AUTHORIZED_API_KEY:-}
      LICENSED_JOB_PROVIDER_BASE_URL: ${LICENSED_JOB_PROVIDER_BASE_URL:-}
      LICENSED_JOB_PROVIDER_API_KEY: ${LICENSED_JOB_PROVIDER_API_KEY:-}
      EMPLOYER_ATS_API_BASE_URL: ${EMPLOYER_ATS_API_BASE_URL:-}
      EMPLOYER_ATS_API_KEY: ${EMPLOYER_ATS_API_KEY:-}
      JSEARCH_API_KEY: ${JSEARCH_API_KEY:-}
      JSEARCH_API_HOST: ${JSEARCH_API_HOST:-jsearch.p.rapidapi.com}
      JSEARCH_API_ENDPOINT: ${JSEARCH_API_ENDPOINT:-https://jsearch.p.rapidapi.com/search-v2}
      JSEARCH_JOB_DETAILS_ENDPOINT: ${JSEARCH_JOB_DETAILS_ENDPOINT:-https://jsearch.p.rapidapi.com/job-details}
      JSEARCH_TIMEOUT_SECONDS: ${JSEARCH_TIMEOUT_SECONDS:-15}
      JSEARCH_MAX_REQUESTS_PER_RUN: ${JSEARCH_MAX_REQUESTS_PER_RUN:-10}
      JSEARCH_MAX_RESULTS_PER_RUN: ${JSEARCH_MAX_RESULTS_PER_RUN:-100}
      JSEARCH_MAX_PAGES_PER_RUN: ${JSEARCH_MAX_PAGES_PER_RUN:-3}
      JSEARCH_RETRY_COUNT: ${JSEARCH_RETRY_COUNT:-2}
      JSEARCH_RETRY_BASE_SECONDS: ${JSEARCH_RETRY_BASE_SECONDS:-1}
      JSEARCH_RATE_LIMIT_SLEEP_SECONDS: ${JSEARCH_RATE_LIMIT_SLEEP_SECONDS:-2}
      JOB_SEARCH_RETENTION_DAYS: ${JOB_SEARCH_RETENTION_DAYS:-90}
    command: ["python", "-m", "app.scheduler_worker"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,sys,time; p='/tmp/scheduler-heartbeat'; sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p) < 3*${RESEARCH_SCHEDULER_POLL_SECONDS:-30} else 1)\""]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      - cybersec-network

  frontend:
    build:
      context: ./frontend
      args:
        # "/" = same origin; nginx proxies /api/ to the backend
        VITE_API_BASE_URL: /
    ports:
      - "0.0.0.0:3100:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5
    networks:
      - cybersec-network

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: cybersec
      POSTGRES_USER: cybersec
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cybersec -d cybersec"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - cybersec-network

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - cybersec-network

networks:
  cybersec-network:
    name: cybersec-career-intelligence-network
    driver: bridge

volumes:
  postgres-data:
    name: cybersec-career-intelligence-postgres-data
